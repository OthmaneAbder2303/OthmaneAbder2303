<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#063B2B"/><stop offset="0.5" stop-color="#0C6B4F"/><stop offset="1" stop-color="#19A974"/>
    </linearGradient>
    <clipPath id="shape"><path d="M0,0 H1200 V196 C1000,240 800,150 600,192 C400,232 200,150 0,204 Z"/></clipPath>
    <style>
      .drift1{animation:d1 12s linear infinite}
      .drift2{animation:d2 18s linear infinite}
      .fade{animation:f 1.2s ease-out .2s both}
      .fade2{animation:f 1.2s ease-out .6s both}
      @keyframes d1{from{transform:translateX(0)}to{transform:translateX(-600px)}}
      @keyframes d2{from{transform:translateX(-600px)}to{transform:translateX(0)}}
      @keyframes f{from{opacity:0}to{opacity:1}}
    </style>
