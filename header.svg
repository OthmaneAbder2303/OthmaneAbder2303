    <path class="drift2" d="M0,180 C150.0,158 150.0,158 300.0,180 S450.0,202 600,180 C750.0,158 750.0,158 900.0,180 S1050.0,202 1200,180 C1350.0,158 1350.0,158 1500.0,180 S1650.0,202 1800,180 C1950.0,158 1950.0,158 2100.0,180 S2250.0,202 2400,180 C2550.0,158 2550.0,158 2700.0,180 S2850.0,202 3000,180 V240 H0 Z" fill="#7DFFBE" fill-opacity="0.10"/>
