<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif" role="img" aria-labelledby="header-title header-desc">
  <title id="header-title">Othmane Abderrazik — Data Scientist</title>
  <desc id="header-desc">Green gradient banner with animated waves, showing Othmane Abderrazik and Data Scientist | Machine Learning &amp; Generative AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#063B2B" />
      <stop offset="0.5" stop-color="#0C6B4F" />
      <stop offset="1" stop-color="#19A974" />
    </linearGradient>
    <clipPath id="shape">
      <path d="M0,0 H1200 V196 C1000,240 800,150 600,192 C400,232 200,150 0,204 Z" />
    </clipPath>
    <style>
      .drift1 { animation: d1 12s linear infinite; }
      .drift2 { animation: d2 18s linear infinite; }
      .fade   { animation: f 1.2s ease-out .2s both; }
      .fade2  { animation: f 1.2s ease-out .6s both; }
      @keyframes d1 { from { transform: translateX(0); } to { transform: translateX(-600px); } }
      @keyframes d2 { from { transform: translateX(-600px); } to { transform: translateX(0); } }
      @keyframes f  { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .drift1, .drift2, .fade, .fade2 { animation: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="1200" height="240" fill="url(#bg)" />
    <path class="drift1" d="M0,165 C150,147 150,147 300,165 S450,183 600,165 C750,147 750,147 900,165 S1050,183 1200,165 C1350,147 1350,147 1500,165 S1650,183 1800,165 C1950,147 1950,147 2100,165 S2250,183 2400,165 C2550,147 2550,147 2700,165 S2850,183 3000,165 V240 H0 Z" fill="#ffffff" fill-opacity="0.07" />
    <path class="drift2" d="M0,180 C150,158 150,158 300,180 S450,202 600,180 C750,158 750,158 900,180 S1050,202 1200,180 C1350,158 1350,158 1500,180 S1650,202 1800,180 C1950,158 1950,158 2100,180 S2250,202 2400,180 C2550,158 2550,158 2700,180 S2850,202 3000,180 V240 H0 Z" fill="#7DFFBE" fill-opacity="0.10" />
  </g>
  <text class="fade" x="600" y="102" text-anchor="middle" font-size="54" font-weight="800" fill="#F4FFF9">Othmane Abderrazik</text>
  <text class="fade2" x="600" y="146" text-anchor="middle" font-size="20" fill="#D6FFEC">Data Scientist  |  Machine Learning &amp; Generative AI</text>
</svg>
